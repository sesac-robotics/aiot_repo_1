# LOCAL DEVELOPMENT ONLY. Replace example password for any shared machine.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: hcc
      POSTGRES_USER: hcc_app
      POSTGRES_PASSWORD: ${HCC_DB_PASSWORD:-change_this_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hcc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcc_app -d hcc"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  hcc_pgdata:
